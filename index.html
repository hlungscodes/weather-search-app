<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>weather app</title>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <form class="submit-form">
          <div class="search">
            <input
              type="text"
              class="searchSpace"
              placeholder="Enter city name"
              spellcheck="false"
            />
            <button type="submit" class="searchBtn">
              <img src="icon/icons8-search-50-2.png" />
            </button>
          </div>
        </form>

        <div class="weather-container">
          <div class="weather">
            <p class="weather-descrip">weather description</p>
            <img class="iconImages" src="icon/clear.png" />
            <h1 class="temperature">℃</h1>
            <p class="city">city</p>
          </div>
          <div class="weather-info">
            <div class="col" id="col">
              <img src="icon/icons8-wind-100.png" />
              <div>
                <h2 class="speed">0 km/h</h2>
                <p class="windspeed">Windspeed</p>
              </div>
            </div>
            <div class="col">
              <img src="icon/icons8-water-96.png" />
              <div>
                <h2 class="percent">0%</h2>
                <p class="humidity">Humidity</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="con">
        <img class="warning-image" />
        <p class="pop-up"></p>
      </div>
      <div class="loader"></div>
    </div>
  </body>
</html>
